---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: attendance-ingress
  namespace: production
  annotations:
    kubernetes.io/ingress.class: "alb"
    alb.ingress.kubernetes.io/scheme: internet-facing
    alb.ingress.kubernetes.io/target-type: ip
    alb.ingress.kubernetes.io/listen-ports: '[{"HTTP": 80}, {"HTTPS": 443}]'
    alb.ingress.kubernetes.io/ssl-redirect: '443'
    alb.ingress.kubernetes.io/certificate-arn: "arn:aws:acm:us-east-1:ACCOUNT_ID:certificate/CERT_ID"
spec:
  rules:
  - host: api.attendance-app.com
    http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service:
            name: attendance-backend-service
            port:
              number: 3000
  - host: attendance-app.com
    http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service:
            name: attendance-frontend-service
            port:
              number: 80

---
apiVersion: v1
kind: NetworkPolicy
metadata:
  name: attendance-network-policy
  namespace: production
spec:
  podSelector:
    matchLabels:
      app: attendance-backend
  policyTypes:
  - Ingress
  - Egress
  ingress:
  - from:
    - podSelector:
        matchLabels:
          app: attendance-frontend
    ports:
    - protocol: TCP
      port: 3000
  egress:
  - to:
    - namespaceSelector: {}
    ports:
    - protocol: TCP
      port: 443
    - protocol: TCP
      port: 27017

---
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: attendance-backend-monitor
  namespace: production
spec:
  selector:
    matchLabels:
      app: attendance-backend
  endpoints:
  - port: http
    interval: 30s
    path: /metrics

---
apiVersion: v1
kind: ResourceQuota
metadata:
  name: attendance-quota
  namespace: production
spec:
  hard:
    requests.cpu: "10"
    requests.memory: "20Gi"
    limits.cpu: "20"
    limits.memory: "40Gi"
    pods: "50"
    services: "10"
    persistentvolumeclaims: "5"

---
apiVersion: v1
kind: LimitRange
metadata:
  name: attendance-limits
  namespace: production
spec:
  limits:
  - max:
      cpu: "2"
      memory: "1Gi"
    min:
      cpu: "100m"
      memory: "128Mi"
    type: Pod
  - max:
      cpu: "1"
      memory: "512Mi"
    min:
      cpu: "50m"
      memory: "64Mi"
    type: Container
